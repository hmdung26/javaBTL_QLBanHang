spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sales_management}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

jwt:
  secret: ${JWT_SECRET:sales-management-demo-secret-key-please-change-in-production}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

app:
  upload-dir: ${APP_UPLOAD_DIR:uploads}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: gemini-2.5-flash
    base-url: https://generativelanguage.googleapis.com
  default-admin:
    username: admin
    password: admin123
